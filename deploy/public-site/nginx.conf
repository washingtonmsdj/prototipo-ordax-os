worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;

    map $uri $ordax_cache_control {
        default "public, max-age=300";
        ~/$ "no-cache";
        ~\.html$ "no-cache";
        /config/public-site.json "no-store";
        /releases/catalog.json "no-store";
        ~^/(auth|sync)/ "no-store";
    }

    server {
        # The public TLS terminator must proxy to this loopback listener.
        # Never expose this HTTP listener directly to the Internet.
        listen 127.0.0.1:8080;
        server_name _;

        root /srv/ordax-public-site;
        index index.html;

        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cache-Control $ordax_cache_control always;

        location ~ ^/(auth|sync)/ {
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name eobcxuyvhkvdmkbaihwh.supabase.co;
            proxy_set_header Host eobcxuyvhkvdmkbaihwh.supabase.co;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Cache-Control;
            rewrite ^(/(?:auth|sync)/.*)$ /functions/v1/ordax-account-gateway$1 break;
            proxy_pass https://eobcxuyvhkvdmkbaihwh.supabase.co;
        }

        location ~ /\. {
            return 404;
        }

        location / {
            try_files $uri $uri/index.html =404;
        }
    }
}

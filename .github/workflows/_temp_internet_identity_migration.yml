name: Temporary Internet Identity Migration

on:
  push:
    branches:
      - design/ordax-glacial-identity

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Migrate Internet chrome to semantic tokens
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          internet = Path("system/apps/internet/internet.css")
          text = internet.read_text(encoding="utf-8")

          # Preserve destructive semantics before converting the old focus color.
          if text.count("color: #9d2f18;") != 2:
              raise SystemExit("Internet destructive-color shape changed")
          text = text.replace("color: #9d2f18;", "color: var(--ordax-danger);")

          text = text.replace("var(--ordax-surface, #efede6)", "var(--ordax-app-bg)")
          text = text.replace("var(--ordax-ink, #171613)", "var(--ordax-text)")
          text = text.replace("#5f5b54", "var(--ordax-muted)")
          text = text.replace("#9d2f18", "var(--ordax-focus)")
          text = text.replace("#ed4b25", "var(--ordax-accent)")

          text = text.replace(
              "background: color-mix(in srgb, var(--ordax-app-bg) 94%, white);",
              "background: color-mix(in srgb, var(--ordax-panel) 82%, var(--ordax-app-bg));",
          )
          text = text.replace(
              "background: color-mix(in srgb, var(--ordax-app-bg) 92%, white);",
              "background: color-mix(in srgb, var(--ordax-panel) 82%, var(--ordax-app-bg));",
          )
          text = text.replace(
              "background: color-mix(in srgb, var(--ordax-app-bg) 88%, white);",
              "background: var(--ordax-subtle-bg);",
          )
          text = text.replace(
              "background: color-mix(in srgb, var(--ordax-app-bg) 84%, white);",
              "background: var(--ordax-subtle-bg);",
          )
          text = text.replace(
              "background: color-mix(in srgb, var(--ordax-app-bg) 82%, white);",
              "background: var(--ordax-subtle-bg);",
          )

          # Browser-owned home/empty surfaces follow the product identity. Actual
          # remote page content remains isolated by its own renderer/frame.
          if text.count("background: #f8f7f3;") != 2:
              raise SystemExit("Internet viewport background shape changed")
          text = text.replace("background: #f8f7f3;", "background: var(--ordax-app-bg);")
          text = text.replace("border: 1px solid rgba(23, 22, 19, .12);", "border: 1px solid var(--ordax-border-soft);")
          text = text.replace("background: rgba(255,255,255,.58);", "background: var(--ordax-subtle-bg);")
          text = text.replace("border: 1px solid rgba(23,22,19,.13);", "border: 1px solid var(--ordax-border-soft);")
          text = text.replace("background: rgba(255,255,255,.55);", "background: var(--ordax-subtle-bg);")
          text = text.replace("border: 1px solid rgba(23,22,19,.14);", "border: 1px solid var(--ordax-border-soft);")
          text = text.replace("background: #f5f2eb;", "background: var(--ordax-surface-strong);")
          text = text.replace("box-shadow: 0 8px 24px rgba(23,22,19,.08);", "box-shadow: var(--ordax-shadow-soft);")
          text = text.replace("background: rgba(255,255,255,.45);", "background: var(--ordax-subtle-bg);")

          save_old = """.ordax-internet-save-button {\n  width: 100%;\n  margin-top: 8px;\n  border: 0;\n  border-radius: 8px;\n  padding: 10px;\n  background: var(--ordax-accent);\n  color: white;\n  font: inherit;\n  font-size: 11px;\n  font-weight: 700;\n}\n"""
          save_new = """.ordax-internet-save-button {\n  width: 100%;\n  margin-top: 8px;\n  border: 0;\n  border-radius: var(--ordax-radius-sm);\n  padding: 10px;\n  background: var(--ordax-button-bg);\n  color: var(--ordax-button-text);\n  font: inherit;\n  font-size: 11px;\n  font-weight: var(--ordax-control-weight);\n}\n"""
          if text.count(save_old) != 1:
              raise SystemExit("Internet save-button shape changed")
          text = text.replace(save_old, save_new, 1)

          text = text.replace(
              "box-shadow: 0 0 0 2px var(--ordax-focus);",
              "box-shadow: 0 0 0 2px color-mix(in srgb, var(--ordax-focus) 32%, transparent);",
          )
          text = text.replace(
              "outline: 2px solid color-mix(in srgb, var(--ordax-accent) 16%, transparent);",
              "outline: 2px solid color-mix(in srgb, var(--ordax-focus) 32%, transparent);",
          )

          for legacy in ("#ed4b25", "#9d2f18", "#5f5b54", "#efede6", "#171613"):
              if legacy in text:
                  raise SystemExit(f"legacy Internet palette literal remains: {legacy}")
          internet.write_text(text.rstrip("\n") + "\n", encoding="utf-8")

          # The last bridge is no longer needed once Internet owns semantic tokens.
          Path("system/surface/ui/app-identity.css").unlink()

          for index_path in ("system/composition/web/index.html", "system/composition/native/index.html"):
              p = Path(index_path)
              html = p.read_text(encoding="utf-8")
              line = '    <link rel="stylesheet" href="../../surface/ui/app-identity.css" />\n'
              if html.count(line) != 1:
                  raise SystemExit(f"app identity link shape changed in {index_path}")
              p.write_text(html.replace(line, "", 1).rstrip("\n") + "\n", encoding="utf-8")

          smoke = Path("tools/surface-web/browser-smoke.mjs")
          smoke_text = smoke.read_text(encoding="utf-8")
          line = "  'system/surface/ui/app-identity.css',\n"
          if smoke_text.count(line) != 1:
              raise SystemExit("browser-smoke app identity entry changed")
          smoke.write_text(smoke_text.replace(line, "", 1).rstrip("\n") + "\n", encoding="utf-8")

          visual = Path("tests/test_surface_visual_identity.py")
          visual_text = visual.read_text(encoding="utf-8")
          visual_text = visual_text.replace(
              'NOTES_CSS = ROOT / "system" / "apps" / "notes" / "notes.css"\n',
              'NOTES_CSS = ROOT / "system" / "apps" / "notes" / "notes.css"\nINTERNET_CSS = ROOT / "system" / "apps" / "internet" / "internet.css"\n',
              1,
          )
          visual_text = visual_text.replace(
              """        identity = SURFACE / \"identity.css\"\n        app_identity = SURFACE / \"app-identity.css\"\n        self.assertTrue(identity.is_file())\n        self.assertTrue(app_identity.is_file())\n""",
              """        identity = SURFACE / \"identity.css\"\n        self.assertTrue(identity.is_file())\n        self.assertFalse((SURFACE / \"app-identity.css\").exists())\n""",
              1,
          )
          bridge_block = """\n        app_css = app_identity.read_text(encoding=\"utf-8\")\n        self.assertNotIn(\".ordax-projects-view\", app_css)\n        self.assertNotIn(\".ordax-notes-workspace\", app_css)\n        self.assertIn(\".ordax-internet-view\", app_css)\n        self.assertIn(\"var(--ordax-button-bg)\", app_css)\n"""
          if visual_text.count(bridge_block) != 1:
              raise SystemExit("visual app bridge assertions changed")
          visual_text = visual_text.replace(bridge_block, "", 1)
          visual_text = visual_text.replace(
              "            self.assertIn('../../surface/ui/app-identity.css', html)\n",
              "            self.assertNotIn('../../surface/ui/app-identity.css', html)\n",
              1,
          )
          marker = """    def test_browser_smoke_exercises_shared_identity_layers(self):\n"""
          internet_test = """    def test_internet_consumes_semantic_tokens_in_component_css(self):\n        css = INTERNET_CSS.read_text(encoding=\"utf-8\")\n        for legacy in (\"#ed4b25\", \"#9d2f18\", \"#5f5b54\", \"#efede6\", \"#171613\"):\n            self.assertNotIn(legacy, css)\n        for declaration in (\n            \"background: var(--ordax-app-bg)\",\n            \"color: var(--ordax-text)\",\n            \"var(--ordax-accent)\",\n            \"var(--ordax-muted)\",\n            \"var(--ordax-focus)\",\n            \"background: var(--ordax-button-bg)\",\n            \"color: var(--ordax-button-text)\",\n            \"var(--ordax-danger)\",\n        ):\n            self.assertIn(declaration, css)\n\n"""
          if visual_text.count(marker) != 1:
              raise SystemExit("visual browser-smoke insertion point changed")
          visual_text = visual_text.replace(marker, internet_test + marker, 1)
          visual_text = visual_text.replace(
              "        self.assertIn(\"'system/surface/ui/app-identity.css'\", smoke)\n",
              "        self.assertNotIn(\"'system/surface/ui/app-identity.css'\", smoke)\n        self.assertIn(\"'system/apps/internet/internet.css'\", smoke)\n",
              1,
          )
          visual.write_text(visual_text.rstrip("\n") + "\n", encoding="utf-8")

          Path(".github/workflows/_temp_internet_identity_migration.yml").unlink()
          PY

      - name: Commit Internet migration
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Migrate Internet styling to semantic tokens'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}.git" "HEAD:${GITHUB_REF}"

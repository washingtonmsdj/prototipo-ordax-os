name: Temporary Internet Identity Migration

on:
  push:
    branches:
      - design/ordax-glacial-identity

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Migrate Internet chrome to semantic tokens
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          internet = Path("system/apps/internet/internet.css")
          text = internet.read_text(encoding="utf-8")

          # Old red was used both for focus and destructive text. Preserve the
          # destructive uses before converting the remaining focus literals.
          if "color: #9d2f18;" not in text:
              raise SystemExit("Internet destructive-color literals missing")
          text = text.replace("color: #9d2f18;", "color: var(--ordax-danger);")

          legacy_pairs = (
              ("var(--ordax-surface, #efede6)", "var(--ordax-app-bg)"),
              ("var(--ordax-ink, #171613)", "var(--ordax-text)"),
              ("#5f5b54", "var(--ordax-muted)"),
              ("#9d2f18", "var(--ordax-focus)"),
              ("#ed4b25", "var(--ordax-accent)"),
          )
          for old, new in legacy_pairs:
              text = text.replace(old, new)

          material_pairs = (
              ("background: color-mix(in srgb, var(--ordax-app-bg) 94%, white);", "background: color-mix(in srgb, var(--ordax-panel) 82%, var(--ordax-app-bg));"),
              ("background: color-mix(in srgb, var(--ordax-app-bg) 92%, white);", "background: color-mix(in srgb, var(--ordax-panel) 82%, var(--ordax-app-bg));"),
              ("background: color-mix(in srgb, var(--ordax-app-bg) 88%, white);", "background: var(--ordax-subtle-bg);"),
              ("background: color-mix(in srgb, var(--ordax-app-bg) 84%, white);", "background: var(--ordax-subtle-bg);"),
              ("background: color-mix(in srgb, var(--ordax-app-bg) 82%, white);", "background: var(--ordax-subtle-bg);"),
              ("background: #f8f7f3;", "background: var(--ordax-app-bg);"),
              ("border: 1px solid rgba(23, 22, 19, .12);", "border: 1px solid var(--ordax-border-soft);"),
              ("background: rgba(255,255,255,.58);", "background: var(--ordax-subtle-bg);"),
              ("border: 1px solid rgba(23,22,19,.13);", "border: 1px solid var(--ordax-border-soft);"),
              ("background: rgba(255,255,255,.55);", "background: var(--ordax-subtle-bg);"),
              ("border: 1px solid rgba(23,22,19,.14);", "border: 1px solid var(--ordax-border-soft);"),
              ("background: #f5f2eb;", "background: var(--ordax-surface-strong);"),
              ("box-shadow: 0 8px 24px rgba(23,22,19,.08);", "box-shadow: var(--ordax-shadow-soft);"),
              ("background: rgba(255,255,255,.45);", "background: var(--ordax-subtle-bg);"),
          )
          for old, new in material_pairs:
              text = text.replace(old, new)

          save_old = """.ordax-internet-save-button {\n  width: 100%;\n  margin-top: 8px;\n  border: 0;\n  border-radius: 8px;\n  padding: 10px;\n  background: var(--ordax-accent);\n  color: white;\n  font: inherit;\n  font-size: 11px;\n  font-weight: 700;\n}\n"""
          save_new = """.ordax-internet-save-button {\n  width: 100%;\n  margin-top: 8px;\n  border: 0;\n  border-radius: var(--ordax-radius-sm);\n  padding: 10px;\n  background: var(--ordax-button-bg);\n  color: var(--ordax-button-text);\n  font: inherit;\n  font-size: 11px;\n  font-weight: var(--ordax-control-weight);\n}\n"""
          if save_old not in text:
              raise SystemExit("Internet save-button shape changed")
          text = text.replace(save_old, save_new, 1)

          text = text.replace(
              "box-shadow: 0 0 0 2px var(--ordax-focus);",
              "box-shadow: 0 0 0 2px color-mix(in srgb, var(--ordax-focus) 32%, transparent);",
          )

          for legacy in ("#ed4b25", "#9d2f18", "#5f5b54", "#efede6", "#171613"):
              if legacy in text:
                  raise SystemExit(f"legacy Internet palette literal remains: {legacy}")
          internet.write_text(text.rstrip("\n") + "\n", encoding="utf-8")

          Path("system/surface/ui/app-identity.css").unlink()

          for index_path in ("system/composition/web/index.html", "system/composition/native/index.html"):
              p = Path(index_path)
              html = p.read_text(encoding="utf-8")
              line = '    <link rel="stylesheet" href="../../surface/ui/app-identity.css" />\n'
              if line not in html:
                  raise SystemExit(f"app identity link missing in {index_path}")
              p.write_text(html.replace(line, "", 1).rstrip("\n") + "\n", encoding="utf-8")

          smoke = Path("tools/surface-web/browser-smoke.mjs")
          smoke_text = smoke.read_text(encoding="utf-8")
          line = "  'system/surface/ui/app-identity.css',\n"
          if line not in smoke_text:
              raise SystemExit("browser-smoke app identity entry missing")
          smoke.write_text(smoke_text.replace(line, "", 1).rstrip("\n") + "\n", encoding="utf-8")

          visual = Path("tests/test_surface_visual_identity.py")
          visual_text = visual.read_text(encoding="utf-8")
          notes_const = 'NOTES_CSS = ROOT / "system" / "apps" / "notes" / "notes.css"\n'
          if notes_const not in visual_text:
              raise SystemExit("Notes CSS visual constant missing")
          visual_text = visual_text.replace(
              notes_const,
              notes_const + 'INTERNET_CSS = ROOT / "system" / "apps" / "internet" / "internet.css"\n',
              1,
          )
          visual_text = visual_text.replace(
              """        identity = SURFACE / \"identity.css\"\n        app_identity = SURFACE / \"app-identity.css\"\n        self.assertTrue(identity.is_file())\n        self.assertTrue(app_identity.is_file())\n""",
              """        identity = SURFACE / \"identity.css\"\n        self.assertTrue(identity.is_file())\n        self.assertFalse((SURFACE / \"app-identity.css\").exists())\n""",
              1,
          )
          bridge_start = visual_text.find('        app_css = app_identity.read_text(encoding="utf-8")\n')
          bridge_end = visual_text.find('\n        for index in (WEB_INDEX, NATIVE_INDEX):', bridge_start)
          if bridge_start < 0 or bridge_end < 0:
              raise SystemExit("visual app bridge assertion block missing")
          visual_text = visual_text[:bridge_start] + visual_text[bridge_end + 1:]
          visual_text = visual_text.replace(
              "            self.assertIn('../../surface/ui/app-identity.css', html)\n",
              "            self.assertNotIn('../../surface/ui/app-identity.css', html)\n",
              1,
          )
          marker = "    def test_browser_smoke_exercises_shared_identity_layers(self):\n"
          internet_test = """    def test_internet_consumes_semantic_tokens_in_component_css(self):\n        css = INTERNET_CSS.read_text(encoding=\"utf-8\")\n        for legacy in (\"#ed4b25\", \"#9d2f18\", \"#5f5b54\", \"#efede6\", \"#171613\"):\n            self.assertNotIn(legacy, css)\n        for declaration in (\n            \"background: var(--ordax-app-bg)\",\n            \"color: var(--ordax-text)\",\n            \"var(--ordax-accent)\",\n            \"var(--ordax-muted)\",\n            \"var(--ordax-focus)\",\n            \"background: var(--ordax-button-bg)\",\n            \"color: var(--ordax-button-text)\",\n            \"var(--ordax-danger)\",\n        ):\n            self.assertIn(declaration, css)\n\n"""
          if marker not in visual_text:
              raise SystemExit("visual browser-smoke insertion point missing")
          visual_text = visual_text.replace(marker, internet_test + marker, 1)
          visual_text = visual_text.replace(
              "        self.assertIn(\"'system/surface/ui/app-identity.css'\", smoke)\n",
              "        self.assertNotIn(\"'system/surface/ui/app-identity.css'\", smoke)\n        self.assertIn(\"'system/apps/internet/internet.css'\", smoke)\n",
              1,
          )
          visual.write_text(visual_text.rstrip("\n") + "\n", encoding="utf-8")

          Path(".github/workflows/_temp_internet_identity_migration.yml").unlink()
          PY

      - name: Commit Internet migration
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Migrate Internet styling to semantic tokens'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}.git" "HEAD:${GITHUB_REF}"

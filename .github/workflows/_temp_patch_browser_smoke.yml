name: Temporary Browser Smoke Patch

on:
  push:
    branches:
      - design/ordax-glacial-identity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Patch browser smoke and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/surface-web/browser-smoke.mjs")
          text = path.read_text(encoding="utf-8")
          old = """  'system/surface/ui/tokens.css',\n  'system/surface/ui/surface.css',"""
          new = """  'system/surface/ui/tokens.css',\n  'system/surface/ui/identity.css',\n  'system/surface/ui/app-identity.css',\n  'system/surface/ui/surface.css',"""
          if text.count(old) != 1:
              raise SystemExit("browser smoke CSS list shape changed")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/_temp_patch_browser_smoke.yml").unlink()
          PY

      - name: Commit focused smoke coverage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/surface-web/browser-smoke.mjs .github/workflows/_temp_patch_browser_smoke.yml
          git commit -m 'Exercise glacial identity in browser smoke'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}.git" "HEAD:${GITHUB_REF}"

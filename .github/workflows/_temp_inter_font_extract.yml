name: Temporary Inter Font Extract

on:
  push:
    branches:
      - design/ordax-glacial-identity

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch and verify pinned Inter Latin variable WOFF2
        shell: bash
        run: |
          set -euo pipefail
          url='https://raw.githubusercontent.com/fontsource/font-files/d946f2f5f48bb73bb238d189d3b182c98dcbca10/fonts/variable/inter/files/inter-latin-wght-normal.woff2'
          curl --fail --silent --show-error --location "$url" --output inter-latin-wght-normal.woff2
          test "$(wc -c < inter-latin-wght-normal.woff2)" -eq 48256
          actual="$(git hash-object inter-latin-wght-normal.woff2)"
          test "$actual" = 'd15208de03cd1ad7c5199f0a0ce915fe841e4722'

      - name: Commit verified font asset to redesign branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > payload.json
          import base64, json, os
          from pathlib import Path
          payload = {
              "message": "Vendor local Inter font for offline Surface",
              "content": base64.b64encode(Path("inter-latin-wght-normal.woff2").read_bytes()).decode("ascii"),
              "branch": os.environ["GH_BRANCH"],
          }
          print(json.dumps(payload, separators=(",", ":")))
          PY
          curl --fail --silent --show-error \
            --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @payload.json \
            "https://api.github.com/repos/${GH_REPOSITORY}/contents/system/surface/ui/fonts/inter-latin-wght-normal.woff2" \
            >/dev/null

name: Surface Runtime Lock Discovery

on:
  pull_request:
    paths:
      - 'bootstrap/surface-runtime/**'
      - 'bootstrap/base/alpine_core.py'
      - 'bootstrap/stable-base/source.json'
      - 'tests/test_surface_runtime_source_contract.py'
      - '.github/workflows/surface-runtime-lock-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install bounded discovery dependency
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends proot

      - name: Validate offline runtime source contract
        run: |
          set -euo pipefail
          python -m unittest tests.test_surface_runtime_source_contract -v
          python -m py_compile bootstrap/surface-runtime/discover_lock.py

      - name: Resolve full transitive Alpine package lock
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/surface-runtime"
          python bootstrap/surface-runtime/discover_lock.py             --cache-dir "$RUNNER_TEMP/surface-runtime/cache"             --out "$RUNNER_TEMP/surface-runtime/surface-runtime-lock.json"

          python - "$RUNNER_TEMP/surface-runtime/surface-runtime-lock.json" <<'PY'
          import json, pathlib, sys
          result = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert result['status'] == 'discovered-not-promotable'
          assert result['first_boot_offline_required'] is True
          assert result['physical_artifact_created'] is False
          assert result['physical_write_authorized'] is False
          assert result['portable_v2_boot_connected'] is False
          assert result['resolved_package_count'] == len(result['apk_package_lock'])
          assert result['resolved_package_count'] >= len(result['requested_packages'])
          print('SURFACE_RUNTIME_LOCK_DISCOVERY=PASS')
          print('SURFACE_RUNTIME_PROMOTABLE=NO')
          PY

      - name: Upload lock discovery metadata only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: surface-runtime-lock-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/surface-runtime/surface-runtime-lock.json
          if-no-files-found: error
          retention-days: 14

name: Initramfs Candidate

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/initramfs/**"
      - "tests/test_initramfs_source_contract.py"
      - ".github/workflows/initramfs-candidate.yml"
  pull_request:
    paths:
      - "bootstrap/initramfs/**"
      - "tests/test_initramfs_source_contract.py"
      - ".github/workflows/initramfs-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  initramfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install initramfs build and runtime-proof dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make musl-tools binutils bzip2 e2fsprogs erofs-utils util-linux

      - name: Validate initramfs source contract
        run: python bootstrap/initramfs/build.py check

      - name: Run initramfs source regressions
        run: python -m unittest discover -s tests -p 'test_initramfs_source_contract.py' -v

      - name: Build deterministic initramfs candidate
        run: python bootstrap/initramfs/build.py build --jobs 4

      - name: Verify initramfs candidate
        run: python bootstrap/initramfs/build.py verify

      - name: Prove isolated portable mount helper on disposable images
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/portable-mount-helper"
          mkdir -p \
            "$work/system-source/system" \
            "$work/base-source/sbin" \
            "$work/state-mount" \
            "$work/base-mount" \
            "$work/root-mount" \
            "$work/release-mount" \
            "$work/system-mount"
          printf '#!/bin/sh\nexit 0\n' > "$work/system-source/system/entrypoint"
          chmod 0755 "$work/system-source/system/entrypoint"
          printf '#!/bin/sh\nexit 0\n' > "$work/base-source/sbin/ordax-stable-init"
          chmod 0755 "$work/base-source/sbin/ordax-stable-init"
          mkfs.erofs -T 0 -U 00000000-0000-0000-0000-000000000001 \
            -L ORDAX-SYSTEM "$work/system.erofs" "$work/system-source"
          mkfs.erofs -T 0 -U 00000000-0000-0000-0000-000000000002 \
            -L ORDAX-BASE "$work/stable-base.erofs" "$work/base-source"

          truncate -s 67108864 "$work/state.img"
          mkfs.ext4 -q -F -L ORDAX-STATE "$work/state.img"
          debugfs -w -R 'mkdir /ordax' "$work/state.img"
          debugfs -w -R 'mkdir /ordax/base' "$work/state.img"
          debugfs -w -R 'mkdir /ordax/base/upper' "$work/state.img"
          debugfs -w -R 'mkdir /ordax/base/work' "$work/state.img"
          debugfs -w -R 'mkdir /ordax/portable-release' "$work/state.img"

          helper="$PWD/out/initramfs-work/ordax-portable-mount"
          test -x "$helper"
          sudo "$helper" mount-state "$work/state.img" "$work/state-mount"
          sudo "$helper" mount-base \
            "$work/stable-base.erofs" \
            "$work/state-mount" \
            "$work/base-mount" \
            "$work/root-mount"
          sudo "$helper" mount-system \
            "$work/system.erofs" \
            "$work/release-mount" \
            "$work/system-mount"

          test -x "$work/root-mount/sbin/ordax-stable-init"
          printf 'persistent-base\n' | sudo tee "$work/root-mount/.ordax-base-proof" >/dev/null
          sync
          test -f "$work/state-mount/ordax/base/upper/.ordax-base-proof"
          test ! -e "$work/base-mount/.ordax-base-proof"

          test -x "$work/system-mount/entrypoint"
          sudo sh -n "$work/system-mount/entrypoint"
          if printf 'forbidden\n' | sudo tee "$work/system-mount/.ordax-system-write-proof" >/dev/null 2>&1; then
            echo 'immutable system mount unexpectedly accepted a write' >&2
            exit 1
          fi
          test ! -e "$work/release-mount/system/.ordax-system-write-proof"

          sudo umount "$work/system-mount"
          sudo umount "$work/release-mount"
          sudo umount "$work/root-mount"
          sudo umount "$work/base-mount"
          sudo umount "$work/state-mount"
          echo 'PORTABLE_MOUNT_HELPER_RUNTIME_PROOF=PASS'
          echo 'PORTABLE_BASE_OVERLAY=PASS'
          echo 'PORTABLE_SYSTEM_IMMUTABLE=PASS'
          echo 'PID1_CONNECTED=NO'
          echo 'PHYSICAL_DEVICE_TOUCHED=NO'

      - name: Prove ext4 online growth and read-only refusal
        run: |
          bash bootstrap/initramfs/prove_ext4_growth.sh \
            out/initramfs-work/ordax-grow-ext4 \
            out/initramfs-proof/ext4-growth-runtime-proof.json

      - name: Upload initramfs candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ordax-initramfs-${{ github.sha }}
          path: out/initramfs/
          if-no-files-found: error
          retention-days: 14

      - name: Upload ext4 growth runtime proof
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ordax-ext4-growth-runtime-proof-${{ github.sha }}
          path: out/initramfs-proof/ext4-growth-runtime-proof.json
          if-no-files-found: error
          retention-days: 14

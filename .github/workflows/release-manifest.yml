name: Release Manifest Tooling

on:
  push:
    branches: [main]
    paths:
      - 'tools/release-manifest/**'
      - 'docs/RELEASE-MANIFEST.md'
      - '.github/workflows/release-manifest.yml'
  pull_request:
    paths:
      - 'tools/release-manifest/**'
      - 'docs/RELEASE-MANIFEST.md'
      - '.github/workflows/release-manifest.yml'

permissions:
  contents: read

jobs:
  release-manifest:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Test manifest generation policy
        working-directory: tools/release-manifest
        run: go test -count=1 ./...

      - name: Build Linux and Windows tooling
        run: |
          set -euo pipefail
          mkdir -p out/release-manifest
          (
            cd tools/release-manifest
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -trimpath -buildvcs=false -ldflags='-s -w' \
              -o ../../out/release-manifest/ordax-release-manifest-linux-amd64 .
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
              go build -trimpath -buildvcs=false -ldflags='-s -w' \
              -o ../../out/release-manifest/ordax-release-manifest-windows-amd64.exe .
          )

      - name: Prove manifest pins exact system tar
        run: |
          set -euo pipefail
          tool="$PWD/out/release-manifest/ordax-release-manifest-linux-amd64"
          work="$RUNNER_TEMP/release-manifest-proof"
          mkdir -p "$work"
          printf 'ci-system-tar\n' > "$work/system.tar"
          "$tool" \
            --artifact "$work/system.tar" \
            --source-commit 0123456789abcdef0123456789abcdef01234567 \
            --artifact-url https://example.invalid/system.tar \
            --out "$work/release-manifest.json" | tee "$work/output.txt"
          python - "$work/release-manifest.json" "$work/system.tar" <<'PY'
          import hashlib, json, pathlib, sys
          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text())
          payload = pathlib.Path(sys.argv[2]).read_bytes()
          artifact = manifest['artifacts'][0]
          assert manifest['source_commit'] == '0123456789abcdef0123456789abcdef01234567'
          assert manifest['release_id'] == manifest['source_commit']
          assert artifact['name'] == 'system.tar'
          assert artifact['role'] == 'system'
          assert artifact['size'] == len(payload)
          assert artifact['sha256'] == hashlib.sha256(payload).hexdigest()
          print('RELEASE_MANIFEST_IDENTITY=PASS')
          PY
          echo 'RELEASE_SIGNED=NO'
          echo 'RELEASE_PUBLISHED=NO'
          echo 'PHYSICAL_WRITE_AUTHORIZED=NO'

      - name: Prove portable v3 manifest pins system and Surface runtime
        run: |
          set -euo pipefail
          tool="$PWD/out/release-manifest/ordax-release-manifest-linux-amd64"
          work="$RUNNER_TEMP/release-manifest-v3-proof"
          mkdir -p "$work"
          printf 'ci-system-erofs\n' > "$work/system.erofs"
          printf 'ci-surface-runtime-erofs\n' > "$work/native-surface-runtime.erofs"
          "$tool" \
            --manifest-schema 3 \
            --artifact "$work/system.erofs" \
            --runtime-artifact "$work/native-surface-runtime.erofs" \
            --source-commit 0123456789abcdef0123456789abcdef01234567 \
            --artifact-url https://example.invalid/system.erofs \
            --runtime-artifact-url https://example.invalid/native-surface-runtime.erofs \
            --out "$work/release-manifest-v3.json" | tee "$work/output-v3.txt"
          python - "$work/release-manifest-v3.json" "$work/system.erofs" "$work/native-surface-runtime.erofs" <<'PY'
          import hashlib, json, pathlib, sys
          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text())
          system = pathlib.Path(sys.argv[2]).read_bytes()
          runtime = pathlib.Path(sys.argv[3]).read_bytes()
          artifacts = manifest['artifacts']
          assert manifest['$schema'] == 'prototype-ordax.release-manifest/3'
          assert manifest['source_commit'] == '0123456789abcdef0123456789abcdef01234567'
          assert manifest['release_id'] == manifest['source_commit']
          assert manifest['product_mode'] == 'usb'
          assert manifest['storage_profile'] == 'portable-usb-v2'
          assert manifest['runtime_format'] == 'erofs'
          assert [(a['name'], a['role']) for a in artifacts] == [
              ('system.erofs', 'system-image'),
              ('native-surface-runtime.erofs', 'surface-runtime'),
          ]
          assert artifacts[0]['size'] == len(system)
          assert artifacts[0]['sha256'] == hashlib.sha256(system).hexdigest()
          assert artifacts[1]['size'] == len(runtime)
          assert artifacts[1]['sha256'] == hashlib.sha256(runtime).hexdigest()
          print('RELEASE_MANIFEST_V3_IDENTITY=PASS')
          PY
          echo 'RELEASE_SIGNED=NO'
          echo 'RELEASE_PUBLISHED=NO'
          echo 'PHYSICAL_WRITE_AUTHORIZED=NO'

      - name: Prove portable v4 manifest pins local AI runtime and source lock
        run: |
          set -euo pipefail
          tool="$PWD/out/release-manifest/ordax-release-manifest-linux-amd64"
          work="$RUNNER_TEMP/release-manifest-v4-proof"
          mkdir -p "$work"
          printf 'ci-system-erofs-v4\n' > "$work/system.erofs"
          printf 'ci-surface-runtime-erofs-v4\n' > "$work/native-surface-runtime.erofs"
          printf 'ci-local-ai-runtime-erofs-v4\n' > "$work/local-ai-runtime.erofs"
          cat > "$work/source-lock.json" <<'JSON'
          {
            "$schema": "prototype-ordax.local-ai-source-lock/1",
            "engine": {
              "id": "llama.cpp",
              "repository": "https://github.com/ggml-org/llama.cpp",
              "commit": "7ab4ee7baad2d920464cbacfad4f4b07cf111fd2",
              "license": "MIT"
            },
            "model": {
              "id": "qwen3.5-0.8b-q4_0",
              "repository": "ggml-org/Qwen3.5-0.8B-GGUF",
              "filename": "Qwen3.5-0.8B-Q4_0.gguf",
              "sha256": "57d1997790d1744fba5b40a7317df71ea5e2acee28c47e78f0cce39c0703f8cf",
              "size_bytes": 563036064,
              "license": "Apache-2.0",
              "upstream_revision": "9447f74"
            }
          }
          JSON
          "$tool" \
            --manifest-schema 4 \
            --artifact "$work/system.erofs" \
            --runtime-artifact "$work/native-surface-runtime.erofs" \
            --local-ai-artifact "$work/local-ai-runtime.erofs" \
            --local-ai-source-lock "$work/source-lock.json" \
            --source-commit 0123456789abcdef0123456789abcdef01234567 \
            --artifact-url https://example.invalid/system.erofs \
            --runtime-artifact-url https://example.invalid/native-surface-runtime.erofs \
            --local-ai-artifact-url https://example.invalid/local-ai-runtime.erofs \
            --out "$work/release-manifest-v4.json" | tee "$work/output-v4.txt"
          python - "$work/release-manifest-v4.json" "$work/local-ai-runtime.erofs" "$work/source-lock.json" <<'PY'
          import hashlib, json, pathlib, sys
          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text())
          ai = pathlib.Path(sys.argv[2]).read_bytes()
          source_lock = pathlib.Path(sys.argv[3]).read_bytes()
          assert manifest['$schema'] == 'prototype-ordax.release-manifest/4'
          assert [(a['name'], a['role']) for a in manifest['artifacts']] == [
              ('system.erofs', 'system-image'),
              ('native-surface-runtime.erofs', 'surface-runtime'),
              ('local-ai-runtime.erofs', 'local-ai-runtime'),
          ]
          assert manifest['artifacts'][2]['sha256'] == hashlib.sha256(ai).hexdigest()
          binding = manifest['local_ai']
          assert binding['contract'] == 'ordax.local-ai/1'
          assert binding['source_lock_sha256'] == hashlib.sha256(source_lock).hexdigest()
          assert binding['engine_source_commit'] == '7ab4ee7baad2d920464cbacfad4f4b07cf111fd2'
          assert binding['model_sha256'] == '57d1997790d1744fba5b40a7317df71ea5e2acee28c47e78f0cce39c0703f8cf'
          assert binding['model_size'] == 563036064
          print('RELEASE_MANIFEST_V4_LOCAL_AI_BINDING=PASS')
          PY
          echo 'REAL_LOCAL_AI_RUNTIME_BUILT=NO'
          echo 'RELEASE_SIGNED=NO'
          echo 'PHYSICAL_WRITE_AUTHORIZED=NO'

      - name: Upload public tooling candidates only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-manifest-tooling-${{ github.sha }}
          path: |
            out/release-manifest/ordax-release-manifest-linux-amd64
            out/release-manifest/ordax-release-manifest-windows-amd64.exe
          if-no-files-found: error
          retention-days: 14

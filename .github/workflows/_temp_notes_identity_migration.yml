name: Temporary Notes Identity Migration

on:
  push:
    branches:
      - design/ordax-glacial-identity

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Migrate Notes to semantic tokens
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          notes = Path("system/apps/notes/notes.css")
          text = notes.read_text(encoding="utf-8")
          aliases_old = """  --notes-paper: #f9f7f1;\n  --notes-ivory: #efede6;\n  --notes-ink: #171613;\n  --notes-muted: #6c6860;\n  --notes-accent: #ed4b25;\n  --notes-soft: color-mix(in srgb, var(--notes-accent) 9%, transparent);\n"""
          aliases_new = """  --notes-paper: var(--ordax-panel);\n  --notes-ivory: var(--ordax-app-bg);\n  --notes-ink: var(--ordax-text);\n  --notes-muted: var(--ordax-muted);\n  --notes-accent: var(--ordax-accent);\n  --notes-soft: var(--ordax-selected-bg);\n"""
          if text.count(aliases_old) != 1:
              raise SystemExit("Notes local palette block changed")
          text = text.replace(aliases_old, aliases_new, 1)
          text = text.replace(
              """  background: var(--notes-accent);\n  color: #fff;\n  cursor: pointer;\n  font: inherit;\n  font-weight: 650;\n  text-align: left;\n""",
              """  background: var(--ordax-button-bg);\n  color: var(--ordax-button-text);\n  cursor: pointer;\n  font: inherit;\n  font-weight: var(--ordax-control-weight);\n  text-align: left;\n""",
              1,
          )
          text = text.replace(
              """.ordax-notes-delete-forever {\n  color: #a62d20;\n}\n\n.ordax-notes-delete-forever:hover,\n.ordax-notes-delete-forever:focus-visible {\n  background: color-mix(in srgb, #a62d20 9%, var(--ordax-hover-bg));\n  color: #8d2117;\n}\n""",
              """.ordax-notes-delete-forever {\n  color: var(--ordax-danger);\n}\n\n.ordax-notes-delete-forever:hover,\n.ordax-notes-delete-forever:focus-visible {\n  background: var(--ordax-danger-bg);\n  color: var(--ordax-danger);\n}\n""",
              1,
          )
          attach_old = """  background: var(--notes-accent);\n  color: #fff;\n  cursor: pointer;\n  font: inherit;\n  font-size: 0.68rem;\n  font-weight: 650;\n"""
          attach_new = """  background: var(--ordax-button-bg);\n  color: var(--ordax-button-text);\n  cursor: pointer;\n  font: inherit;\n  font-size: 0.68rem;\n  font-weight: var(--ordax-control-weight);\n"""
          if text.count(attach_old) != 1:
              raise SystemExit("Notes attach button shape changed")
          text = text.replace(attach_old, attach_new, 1)
          notes.write_text(text.rstrip("\n") + "\n", encoding="utf-8")

          bridge = Path("system/surface/ui/app-identity.css")
          bridge_text = bridge.read_text(encoding="utf-8")
          bridge_text = bridge_text.replace(
              """.ordax-notes-workspace,\n.ordax-internet-view {\n  color: var(--ordax-text);\n}\n\n/* Notes still exposes local aliases; bind them to the shared semantic source. */\n.ordax-notes-workspace {\n  --notes-ivory: var(--ordax-window-bg) !important;\n  --notes-ink: var(--ordax-text) !important;\n  --notes-muted: var(--ordax-muted) !important;\n  --notes-accent: var(--ordax-accent) !important;\n  --notes-soft: var(--ordax-selected-bg) !important;\n}\n\n""",
              """.ordax-internet-view {\n  color: var(--ordax-text);\n}\n\n""",
              1,
          )
          bridge.write_text(bridge_text.rstrip("\n") + "\n", encoding="utf-8")

          for test_path in ("tests/test_notes_native.py", "tests/test_surface_ui_contract.py"):
              p = Path(test_path)
              test = p.read_text(encoding="utf-8")
              old = 'self.assertIn("--notes-accent: #ed4b25", css)'
              new = 'self.assertIn("--notes-accent: var(--ordax-accent)", css)'
              if test.count(old) != 1:
                  raise SystemExit(f"legacy Notes assertion changed in {test_path}")
              p.write_text(test.replace(old, new, 1).rstrip("\n") + "\n", encoding="utf-8")

          visual = Path("tests/test_surface_visual_identity.py")
          visual_text = visual.read_text(encoding="utf-8")
          visual_text = visual_text.replace(
              'PROJECTS_CSS = ROOT / "system" / "apps" / "projects" / "projects.css"\n',
              'PROJECTS_CSS = ROOT / "system" / "apps" / "projects" / "projects.css"\nNOTES_CSS = ROOT / "system" / "apps" / "notes" / "notes.css"\n',
              1,
          )
          visual_text = visual_text.replace(
              '        self.assertIn(".ordax-notes-workspace", app_css)\n',
              '        self.assertNotIn(".ordax-notes-workspace", app_css)\n',
              1,
          )
          marker = """    def test_browser_smoke_exercises_shared_identity_layers(self):\n"""
          test_block = """    def test_notes_consumes_semantic_tokens_in_component_css(self):\n        css = NOTES_CSS.read_text(encoding=\"utf-8\")\n        self.assertNotIn(\"--notes-accent: #ed4b25\", css)\n        for declaration in (\n            \"--notes-paper: var(--ordax-panel)\",\n            \"--notes-ivory: var(--ordax-app-bg)\",\n            \"--notes-ink: var(--ordax-text)\",\n            \"--notes-muted: var(--ordax-muted)\",\n            \"--notes-accent: var(--ordax-accent)\",\n            \"--notes-soft: var(--ordax-selected-bg)\",\n            \"background: var(--ordax-button-bg)\",\n            \"color: var(--ordax-button-text)\",\n            \"background: var(--ordax-danger-bg)\",\n        ):\n            self.assertIn(declaration, css)\n\n"""
          if visual_text.count(marker) != 1:
              raise SystemExit("visual identity test insertion point changed")
          visual_text = visual_text.replace(marker, test_block + marker, 1)
          visual.write_text(visual_text.rstrip("\n") + "\n", encoding="utf-8")

          Path(".github/workflows/_temp_notes_identity_migration.yml").unlink()
          PY

      - name: Commit Notes migration
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Migrate Notes styling to semantic tokens'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}.git" "HEAD:${GITHUB_REF}"

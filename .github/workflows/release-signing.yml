name: Release Signing Tooling

on:
  push:
    branches: [main]
    paths:
      - 'tools/release-signing/**'
      - 'bootstrap/release-acquisition/**'
      - 'bootstrap/trust/README.md'
      - 'docs/RELEASE-SIGNING.md'
      - 'docs/RELEASE-BUNDLE.md'
      - 'docs/RELEASE-PIPELINE.md'
      - 'tests/test_release_v4_signing_runbook.py'
      - '.github/workflows/release-signing.yml'
  pull_request:
    paths:
      - 'tools/release-signing/**'
      - 'bootstrap/release-acquisition/**'
      - 'bootstrap/trust/README.md'
      - 'docs/RELEASE-SIGNING.md'
      - '.github/workflows/release-signing.yml'

permissions:
  contents: read

jobs:
  signing-tooling:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Test release signing boundary
        working-directory: tools/release-signing
        run: go test -count=1 ./...

      - name: Test canonical v4 signing runbook contract
        run: python3 -m unittest tests.test_release_v4_signing_runbook -v

      - name: Build signer and verifier candidates
        run: |
          set -euo pipefail
          mkdir -p out/release-signing
          (
            cd tools/release-signing
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -trimpath -buildvcs=false -ldflags='-s -w' \
              -o ../../out/release-signing/ordax-release-signing-linux-amd64 .
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
              go build -trimpath -buildvcs=false -ldflags='-s -w' \
              -o ../../out/release-signing/ordax-release-signing-windows-amd64.exe .
          )
          (
            cd bootstrap/release-acquisition
            go test -count=1 ./...
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -trimpath -buildvcs=false -ldflags='-s -w' \
              -o ../../out/release-signing/ordax-release-agent-linux-amd64 .
          )

      - name: Prove signer and release agent protocol compatibility
        run: |
          set -euo pipefail
          signer="$PWD/out/release-signing/ordax-release-signing-linux-amd64"
          agent="$PWD/out/release-signing/ordax-release-agent-linux-amd64"
          work="$RUNNER_TEMP/release-signing-proof"
          mkdir -p "$work"
          chmod 0700 "$work"
          cat > "$work/release-manifest.json" <<'JSON'
          {
            "$schema": "prototype-ordax.release-manifest/1",
            "source_repository": "washingtonmsdj/prototipo-ordax-os",
            "source_commit": "0123456789abcdef0123456789abcdef01234567",
            "release_id": "0123456789abcdef0123456789abcdef01234567",
            "created_from_ci_recipe": "release/native/1",
            "artifacts": [
              {
                "name": "system.tar",
                "role": "system",
                "url": "https://example.invalid/system.tar",
                "sha256": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
                "size": 123
              }
            ]
          }
          JSON
          "$signer" generate-key \
            --private-key "$work/private.pem" \
            --trust "$work/trust.json" \
            --key-id ci-test-1
          "$signer" sign \
            --manifest "$work/release-manifest.json" \
            --private-key "$work/private.pem" \
            --trust "$work/trust.json" \
            --key-id ci-test-1 \
            --out "$work/release-envelope.json"
          "$signer" derive-trust \
            --private-key "$work/private.pem" \
            --key-id ci-test-1 \
            --out "$work/derived-trust.json"
          cmp "$work/trust.json" "$work/derived-trust.json"
          test "$(stat -c '%a' "$work/private.pem")" = 600
          "$signer" generate-key \
            --private-key "$work/next-private.pem" \
            --trust "$work/next-trust.json" \
            --key-id ci-test-2
          "$signer" sign-trust-transition \
            --current-private-key "$work/private.pem" \
            --current-trust "$work/trust.json" \
            --next-trust "$work/next-trust.json" \
            --sequence 1 \
            --out "$work/trust-transition.json"
          transition_output="$("$agent" verify-trust-transition \
            --envelope "$work/trust-transition.json" \
            --current-trust "$work/trust.json" \
            --expected-sequence 1 \
            --out-next-trust "$work/verified-next-trust.json")"
          printf '%s\n' "$transition_output"
          grep -q '"status": "trust-transition-verified"' <<<"$transition_output"
          grep -q '"sequence": 1' <<<"$transition_output"
          grep -q '"next_key_id": "ci-test-2"' <<<"$transition_output"
          cmp "$work/next-trust.json" "$work/verified-next-trust.json"
          verify_output="$("$agent" verify-envelope \
            --envelope "$work/release-envelope.json" \
            --trust "$work/trust.json")"
          printf '%s\n' "$verify_output"
          grep -q '"status": "verified"' <<<"$verify_output"
          grep -q '"source_commit": "0123456789abcdef0123456789abcdef01234567"' <<<"$verify_output"
          rm -f "$work/private.pem" "$work/next-private.pem"
          test ! -e "$work/private.pem"
          test ! -e "$work/next-private.pem"
          echo 'SIGNER_TRUST_MATCH=PASS'
          echo 'TRUST_TRANSITION_PROTOCOL=PASS'
          echo 'SIGNER_AGENT_PROTOCOL=PASS'
          echo 'CI_TEST_KEY_REMOVED=YES'
          echo 'CANONICAL_TRUST_ANCHOR=NO'
          echo 'PHYSICAL_WRITE_AUTHORIZED=NO'

      - name: Upload public tooling candidates only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-signing-tooling-${{ github.sha }}
          path: |
            out/release-signing/ordax-release-signing-linux-amd64
            out/release-signing/ordax-release-signing-windows-amd64.exe
          if-no-files-found: error
          retention-days: 14
